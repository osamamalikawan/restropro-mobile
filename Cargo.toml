[package]
name = "restropro-pos"
version = "0.1.0"
description = "Restro Pro POS — desktop shell with direct network thermal printer support"
edition = "2021"

[lib]
name = "restropro_pos_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
nusb = "0.2"
windows = { version = "0.58", features = ["Win32_Graphics_Printing", "Win32_Graphics_Gdi", "Win32_Foundation", "Win32_Security"] }

[[bin]]
name = "restropro-pos"
path = "src/main.rs"
