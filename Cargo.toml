[package]
name = "restropro-pos"
version = "1.0.0"
description = "Restro Pro POS — Windows + Android shell: offline-first sync and thermal printing"
edition = "2021"

[lib]
name = "restropro_pos_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# rustls instead of the default native-tls: native-tls needs OpenSSL, which is painful on Android.
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
sha2 = "0.10"
zip = { version = "2", default-features = false, features = ["deflate"] }
mime_guess = "2"
bcrypt = "0.15"
rusqlite = { version = "0.31", features = ["bundled"] }
chrono = { version = "0.4", features = ["serde"] }

# Desktop only: no Android backend / not meaningful on a phone.
[target.'cfg(not(target_os = "android"))'.dependencies]
dirs = "5"
nusb = "0.2"
serialport = { version = "4", default-features = false }
keyring = { version = "3", features = ["windows-native", "apple-native"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = ["Win32_Graphics_Printing", "Win32_Graphics_Gdi", "Win32_Foundation", "Win32_Security"] }

[[bin]]
name = "restropro-pos"
path = "src/main.rs"
